<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}</style></head><body>
<canvas id="c"></canvas>
<pre id="out">working...</pre>
<script>
const S=4;
const W=Math.round(850.394*S), H=Math.round(566.929*S);
const cv=document.getElementById('c'); cv.width=W; cv.height=H;
const ctx=cv.getContext('2d');
const img=new Image();
img.onload=()=>{
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.drawImage(img,0,0,W,H);
  const data=ctx.getImageData(0,0,W,H).data;
  const dark=(px,py)=>{const i=(py*W+px)*4; const r=data[i],g=data[i+1],b=data[i+2]; return (r<170&&g<170&&b<170);};
  const A=[];
  for(let sx=455; sx<=792; sx+=3){
    const px=Math.round(sx*S); let found=null;
    for(let sy=425; sy<=500; sy+=0.5){const py=Math.round(sy*S); if(dark(px,py)){found=sy;break;}}
    A.push([sx, found]);
  }
  const B=[];
  for(let sy=193; sy<=430; sy+=3){
    const py=Math.round(sy*S); let found=null;
    for(let sx=815; sx>=735; sx-=0.5){const px=Math.round(sx*S); if(dark(px,py)){found=sx;break;}}
    B.push([sy, found]);
  }
  document.getElementById('out').textContent=JSON.stringify({A,B});
};
img.onerror=()=>{document.getElementById('out').textContent='ERR';};
img.crossOrigin='anonymous';
img.src='/images/mapa-rutas.svg';
</script></body></html>
