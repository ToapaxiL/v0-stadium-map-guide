<!doctype html><html><head><style>html,body{margin:0}</style></head><body>
<canvas id="c"></canvas>
<pre id="out">loading</pre>
<script>
const VW=850.394, VH=566.929, SC=6;
const cv=document.getElementById('c'); cv.width=Math.round(VW*SC); cv.height=Math.round(VH*SC);
const ctx=cv.getContext('2d');
const img=new Image(); img.crossOrigin='anonymous';
img.onload=()=>{
  ctx.drawImage(img,0,0,cv.width,cv.height);
  const D=ctx.getImageData(0,0,cv.width,cv.height).data;
  function lum(px,py){const i=(py*cv.width+px)*4;return (D[i]+D[i+1]+D[i+2])/3;}
  // background is beige ~ (235,230,220) lum~228. contour gray line lum ~ 120-190.
  // A pixel is "line" if lum < 205 (darker than beige) 
  function isLine(px,py){return lum(px,py)<205;}
  // For each x, scan y in [432,492]; record contiguous dark runs; keep run centers.
  const res=[];
  for(let sx=515; sx<=795; sx+=1){
    const px=Math.round(sx*SC);
    let ys=[];
    for(let sy=432; sy<=492; sy+=0.5){
      if(isLine(px, Math.round(sy*SC))) ys.push(sy);
    }
    // group into runs
    let runs=[], cur=[];
    for(let k=0;k<ys.length;k++){
      if(cur.length===0||ys[k]-cur[cur.length-1]<=1.0) cur.push(ys[k]);
      else {runs.push(cur);cur=[ys[k]];}
    }
    if(cur.length) runs.push(cur);
    const centers=runs.map(r=>+( (r[0]+r[r.length-1])/2 ).toFixed(1));
    res.push([sx, centers]);
  }
  document.getElementById('out').textContent = JSON.stringify(res);
  window.__done=true;
};
img.onerror=()=>{document.getElementById('out').textContent='ERR';window.__done=true;};
img.src='/images/mapa-rutas.svg';
</script></body></html>
