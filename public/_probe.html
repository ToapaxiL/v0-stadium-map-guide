<!doctype html><html><head><meta charset="utf-8"></head><body>
<canvas id="c"></canvas>
<pre id="out">working...</pre>
<script>
const VW=850.394, VH=566.929, S=4;
const cv=document.getElementById('c'); cv.width=VW*S; cv.height=VH*S;
const ctx=cv.getContext('2d');
const img=new Image();
img.onload=()=>{
  ctx.drawImage(img,0,0,cv.width,cv.height);
  // Probe the SE walkway outline: for a set of y rows, find the right-most edge of the stadium seating (colored) and the street line.
  // We look for the dark facade line (gray ~#8e8d8d / #676766) between the seating and the street.
  function isLine(r,g,b){ const mx=Math.max(r,g,b),mn=Math.min(r,g,b); const lum=(r+g+b)/3; return (mx-mn)<28 && lum<150 && lum>60; }
  const rows=[];
  for(let vy=195; vy<=470; vy+=5){
    const py=Math.round(vy*S);
    let edges=[];
    for(let vx=560; vx<=830; vx+=1){
      const px=Math.round(vx*S);
      const d=ctx.getImageData(px,py,1,1).data;
      if(isLine(d[0],d[1],d[2])) edges.push(vx);
    }
    rows.push([vy, edges]);
  }
  document.getElementById('out').textContent=JSON.stringify(rows);
};
img.crossOrigin='anonymous';
img.src='/images/mapa-rutas.svg';
</script></body></html>
