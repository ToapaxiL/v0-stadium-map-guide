<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}#w{position:relative;width:1700px}#w img{width:100%;display:block}svg{position:absolute;inset:0;width:100%;height:100%}</style></head>
<body><div id="w">
<img src="/images/mapa-rutas.svg">
<svg id="g" viewBox="0 0 850.394 566.929" preserveAspectRatio="xMidYMid meet"></svg>
<script>
const svg=document.getElementById('g');const NS='http://www.w3.org/2000/svg';
for(let x=0;x<=850;x+=25){const l=document.createElementNS(NS,'line');l.setAttribute('x1',x);l.setAttribute('y1',0);l.setAttribute('x2',x);l.setAttribute('y2',567);l.setAttribute('stroke',x%100===0?'#0a84ff':'#8ab4ff');l.setAttribute('stroke-width',x%100===0?0.6:0.25);l.setAttribute('opacity',0.7);svg.appendChild(l);
 if(x%50===0){const t=document.createElementNS(NS,'text');t.setAttribute('x',x+0.5);t.setAttribute('y',560);t.setAttribute('fill','#0a3');t.setAttribute('font-size',6);t.textContent=x;svg.appendChild(t);}}
for(let y=0;y<=567;y+=25){const l=document.createElementNS(NS,'line');l.setAttribute('x1',0);l.setAttribute('y1',y);l.setAttribute('x2',850);l.setAttribute('y2',y);l.setAttribute('stroke',y%100===0?'#0a84ff':'#8ab4ff');l.setAttribute('stroke-width',y%100===0?0.6:0.25);l.setAttribute('opacity',0.7);svg.appendChild(l);
 if(y%50===0){const t=document.createElementNS(NS,'text');t.setAttribute('x',2);t.setAttribute('y',y-1);t.setAttribute('fill','#a00');t.setAttribute('font-size',6);t.setAttribute('font-weight','700');t.textContent=y;svg.appendChild(t);}}
</script>
</div></body></html>
