<!doctype html><html><head><style>html,body{margin:0}</style></head><body>
<div style="position:relative;width:2400px">
<img src="/images/mapa-rutas.svg" style="width:2400px;display:block">
<svg viewBox="0 0 850.394 566.929" style="position:absolute;inset:0;width:100%;height:100%"><g id="g"></g></svg>
<script>
const g=document.getElementById('g'),NS='http://www.w3.org/2000/svg';
for(let x=0;x<=850;x+=10){const l=document.createElementNS(NS,'line');l.setAttribute('x1',x);l.setAttribute('y1',0);l.setAttribute('x2',x);l.setAttribute('y2',567);l.setAttribute('stroke',x%50==0?'#0000ff':'#aaccff');l.setAttribute('stroke-width',x%50==0?0.4:0.15);g.appendChild(l);if(x%50==0){const t=document.createElementNS(NS,'text');t.setAttribute('x',x+0.4);t.setAttribute('y',300);t.setAttribute('font-size',4);t.setAttribute('fill','#0000ff');t.textContent=x;g.appendChild(t);}}
for(let y=0;y<=567;y+=10){const l=document.createElementNS(NS,'line');l.setAttribute('x1',0);l.setAttribute('y1',y);l.setAttribute('x2',850);l.setAttribute('y2',y);l.setAttribute('stroke',y%50==0?'#cc0000':'#ffbbbb');l.setAttribute('stroke-width',y%50==0?0.4:0.15);g.appendChild(l);if(y%50==0){const t=document.createElementNS(NS,'text');t.setAttribute('x',420);t.setAttribute('y',y-0.4);t.setAttribute('font-size',4);t.setAttribute('fill','#cc0000');t.textContent=y;g.appendChild(t);}}
</script></div></body></html>
