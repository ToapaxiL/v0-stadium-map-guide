<!doctype html><meta charset=utf-8><style>body{margin:0}#w{position:relative;width:1700px}#w img{width:100%;display:block}.gx{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,90,255,.4)}.gy{position:absolute;left:0;right:0;height:1px;background:rgba(0,90,255,.4)}.gl{position:absolute;font:10px monospace;color:#a00;background:rgba(255,255,255,.75);padding:0 1px}</style>
<div id=w><img src="/images/mapa-rutas.svg">
<script>
const VB=850.394, W=1700, sc=W/VB;
const w=document.getElementById('w');
for(let x=0;x<=850;x+=25){const d=document.createElement('div');d.className='gx';d.style.left=(x*sc)+'px';w.appendChild(d);
  for(let ly=750;ly<=1050;ly+=50){const l=document.createElement('div');l.className='gl';l.style.left=(x*sc+1)+'px';l.style.top=(ly)+'px';l.textContent=x;w.appendChild(l);}}
for(let y=0;y<=566;y+=25){const d=document.createElement('div');d.className='gy';d.style.top=(y*sc)+'px';w.appendChild(d);
  for(let lx=850;lx<=1250;lx+=100){const l=document.createElement('div');l.className='gl';l.style.top=(y*sc+1)+'px';l.style.left=(lx)+'px';l.textContent=y;w.appendChild(l);}}
</script></div>
